name: Notify docs site

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Trigger GitHub Actions dispatch
        if: env.GH_TOKEN != '' && env.VERCEL_DEPLOY_HOOK == ''
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/sokpichdev/mobie-site/dispatches \
            -f event_type=toolkit-updated
